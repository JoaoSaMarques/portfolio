<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio</title>
    <link rel="stylesheet" href="css/output.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="Portfolio.styles.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // https://github.com/rafrex/spa-github-pages
        // Copyright (c) 2016 Rafael Pedicini, licensed under the MIT License
        // ----------------------------------------------------------------------
        // This script checks to see if a redirect is present in the query string
        // and converts it back into the correct url and adds it to the
        // browser's history using window.history.replaceState(...),
        // which won't cause the browser to attempt to load the new url.
        // When the single page app is loaded further down in this file,
        // the correct url will be waiting in the browser's history for
        // the single page app to route accordingly.
        (function (l) {
            if (l.search) {
                var q = {};
                l.search.slice(1).split('&').forEach(function (v) {
                    var a = v.split('=');
                    q[a[0]] = a.slice(1).join('=').replace(/~and~/g, '&');
                });
                if (q.p !== undefined) {
                    window.history.replaceState(null, null,
                        l.pathname.slice(0, -1) + (q.p || '') +
                        (q.q ? ('?' + q.q) : '') +
                        l.hash
                    );
                }
            }
        }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
</head>

<body class="bg-background-dark dark:bg-background-dark light:bg-background-light text-text-dark dark:text-text-dark light:text-text-light font-sans transition-colors duration-300">
    <div id="app">
        <div class="loading-container flex items-center justify-center min-h-screen">
           
        </div>
    </div>

    <div id="blazor-error-ui" class="fixed bottom-0 left-0 right-0 bg-yellow-100 dark:bg-yellow-900 border-t-4 border-yellow-500 text-yellow-700 dark:text-yellow-200 px-4 py-3 shadow-lg z-50 hidden">
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <i class="fas fa-exclamation-triangle mr-2"></i>
                <span>An unhandled error has occurred.</span>
            </div>
            <div class="flex items-center space-x-2">
                <a href="" class="text-yellow-800 dark:text-yellow-200 underline hover:text-yellow-900 dark:hover:text-yellow-100">Reload</a>
                <a class="dismiss cursor-pointer text-yellow-800 dark:text-yellow-200 hover:text-yellow-900 dark:hover:text-yellow-100">🗙</a>
            </div>
        </div>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
