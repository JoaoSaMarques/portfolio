name: Build and Publish Blazor

on:
  push:
    branches:
      - source  

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the source branch
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          lfs: true
          ref: source
          fetch-depth: 0

      # 2. Set up .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'  

      # 3. Restore + publish
      - name: Restore dependencies
        run: dotnet restore Portfolio/Portfolio.csproj

      - name: Build & publish
        run: dotnet publish Portfolio/Portfolio.csproj -c Release -o publish

      - name: Commit publish folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "add publish folder [skip ci]" || echo "No changes"
          git push origin source

      - name: Copy portfolio contents
        run: |
          mkdir deploy
          cp -r publish/wwwroot/portfolio/* deploy/

      # 4. Push wwwroot/portfolio to main 
      - name: Deploy to main
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: main   
          force_orphan: false

      - name: Delete publish
        run: |
          git checkout source
          git rm -r publish
          git commit -m "remove publish folder from source [skip ci]" || echo "No changes"
          git push origin source




